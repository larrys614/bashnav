<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="14">
<text x="30.8" y="27.0" fill="#72868f">27000 yd across</text>
<text x="308.0" y="27.0" fill="#72868f">|</text>
<text x="308.0" y="44.0" fill="#72868f">|</text>
<text x="308.0" y="61.0" fill="#72868f">|</text>

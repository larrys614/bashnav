<svg xmlns="http://www.w3.org/2000/svg" width="557" height="402" viewBox="0 0 557 402" role="img" aria-label="colregs: the relative-motion plot from the tracking watch">
<title>colregs: the relative-motion plot from the tracking watch</title>
<rect width="557" height="402" rx="6" fill="#0b1a22"/>
<g font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="14" fill="#c9d6dc" xml:space="preserve">
<text x="14" y="27.0">  <tspan fill="#72868f">27000 yd across</tspan>                  <tspan fill="#72868f">|</tspan></text>
<text x="14" y="44.0">                                   <tspan fill="#72868f">|</tspan></text>
<text x="14" y="61.0">                                   <tspan fill="#72868f">|</tspan></text>
<text x="14" y="78.0">                                   <tspan fill="#72868f">|</tspan></text>
<text x="14" y="95.0">                                   <tspan fill="#72868f">|</tspan>              1</text>
<text x="14" y="112.0">                                   <tspan fill="#72868f">|</tspan>            2<tspan fill="#72868f">..</tspan></text>
<text x="14" y="129.0">                                   <tspan fill="#72868f">|</tspan>          <tspan fill="#72868f">.</tspan>3<tspan fill="#72868f">.</tspan></text>
<text x="14" y="146.0">                                   <tspan fill="#72868f">|</tspan>         <tspan fill="#72868f">.</tspan>4</text>
<text x="14" y="163.0">                                  <tspan fill="#5cbf94">^^^</tspan>      <tspan fill="#72868f">.</tspan>5<tspan fill="#72868f">.</tspan></text>
<text x="14" y="180.0">                                   <tspan fill="#5cbf94">Y</tspan>      <tspan fill="#72868f">..</tspan></text>
<text x="14" y="197.0">                                   <tspan fill="#72868f">|</tspan>    <tspan fill="#72868f">...</tspan></text>
<text x="14" y="214.0">                                   <tspan fill="#72868f">|</tspan>   <tspan fill="#5cbf94">*</tspan><tspan fill="#72868f">.</tspan></text>
<text x="14" y="231.0">                                   <tspan fill="#72868f">|</tspan></text>
<text x="14" y="248.0">                                   <tspan fill="#72868f">|</tspan></text>
<text x="14" y="265.0">                                   <tspan fill="#72868f">|</tspan></text>
<text x="14" y="282.0">                                   <tspan fill="#72868f">|</tspan></text>
<text x="14" y="299.0">                                   <tspan fill="#72868f">|</tspan></text>
<text x="14" y="316.0">                                   <tspan fill="#72868f">|</tspan></text>
<text x="14" y="333.0">                                   <tspan fill="#72868f">|</tspan></text>
<text x="14" y="350.0">  <tspan fill="#72868f">Y = you, head up. 1 to 5 = her, three minutes apart. * = CPA.</tspan></text>
<text x="14" y="367.0">  <tspan fill="#72868f">The upright line is your own track. Which side of you she</tspan></text>
<text x="14" y="384.0">  <tspan fill="#72868f">crosses it is the whole question.</tspan></text>
</g>
</svg>

<text x="308.0" y="333.0" fill="#72868f">|</text>
<text x="30.8" y="350.0" fill="#72868f">Y = you, head up. 1 to 5 = her, three minutes apart. * = CPA.</text>
<text x="30.8" y="367.0" fill="#72868f">The upright line is your own track. Which side of you she</text>
<text x="30.8" y="384.0" fill="#72868f">crosses it is the whole question.</text>

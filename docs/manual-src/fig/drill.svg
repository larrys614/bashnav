<g font-family="DejaVu Sans Mono, monospace" font-size="13.00" fill="#16222c" xml:space="preserve">
<text x="224.8" y="24.4">  DRILL -- sight reduction</text>
<text x="224.8" y="40.7">  ----------------------------------------------------------------------</text>
<text x="224.8" y="57.1">  Assumed position    11 36.0&#x27;S   011 48.0&#x27;W</text>
<text x="224.8" y="73.5">  GHA of the body     314 51.8&#x27;</text>
<text x="224.8" y="89.9">  Declination         N05 59.2&#x27;</text>
<text x="224.8" y="106.2">  ----------------------------------------------------------------------</text>
<text x="224.8" y="122.6">  Work out LHA, then Hc and Zn.</text>
<text x="224.8" y="139.0">  Your Hc   30 42.0&#x27;       CORRECT</text>
<text x="224.8" y="155.4">  Your Zn   75.8 T         CORRECT</text>
<text x="224.8" y="171.8">  ----------------------------------------------------------------------</text>
<text x="224.8" y="188.1">  LHA = GHA + longitude = 314 51.8&#x27; + (011 48.0&#x27;W) = 303 03.8&#x27;</text>
<text x="224.8" y="204.5">  sin Hc = sin(-11.6000) sin(5.9874) + cos(-11.6000) cos(5.9874) cos(303.0636)</text>
<text x="224.8" y="220.9">  Hc = 30 42.0&#x27;          Zn = 75.8 T</text>
</g>
<g font-size="11.0" fill="#1f5673" text-anchor="end">
<text x="199.8" y="44.5">Real figures, generated from the</text>
<text x="199.8" y="57.5">built-in almanac - a different</text>
<text x="199.8" y="70.5">problem every time.</text>
</g>

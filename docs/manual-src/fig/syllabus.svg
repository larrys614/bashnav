<g font-family="DejaVu Sans Mono, monospace" font-size="13.00" fill="#16222c" xml:space="preserve">
<text x="236.8" y="24.4">  LEARN -- the syllabus</text>
<text x="236.8" y="40.7">  ----------------------------------------------------------------------</text>
<text x="236.8" y="57.1"></text>
<text x="236.8" y="73.5">  FOUNDATIONS</text>
<text x="236.8" y="89.9">   [x]  F1   What a sight actually measures</text>
<text x="236.8" y="106.2">   [x]  F2   The geographical position</text>
<text x="236.8" y="122.6">   [x]  F3   Your altitude puts you on a circle</text>
<text x="236.8" y="139.0">   [ ]  F4   Two circles give a fix</text>
<text x="236.8" y="155.4">   [ ]  F5   Why we never draw the circles</text>
<text x="236.8" y="171.8"></text>
<text x="236.8" y="188.1">  TIME AND THE ALMANAC</text>
<text x="236.8" y="204.5">   [x]  T1   Universal Time, and why the clock rules</text>
<text x="236.8" y="220.9">   [ ]  T2   GHA and declination</text>
<text x="236.8" y="237.3">   [ ]  T3   Aries and SHA: why the stars are different</text>
<text x="236.8" y="253.7">   [ ]  T4   LHA: the angle at the pole</text>
<text x="236.8" y="270.1">   [ ]  T5   Using the almanac in CELNAV</text>
<text x="236.8" y="286.4"></text>
<text x="236.8" y="302.8">  SEXTANT AND CORRECTIONS</text>
<text x="236.8" y="319.2">   [ ]  S1   Taking a sight</text>
<text x="236.8" y="335.6">   [ ]  S2   Index error and dip</text>
<text x="236.8" y="351.9">   [ ]  S3   Refraction</text>
<text x="236.8" y="368.3">   [ ]  S4   Semi-diameter and parallax</text>
<text x="236.8" y="384.7">   [ ]  S5   The whole chain, and the size of each part</text>
<text x="236.8" y="401.1"></text>
<text x="236.8" y="417.5">  REDUCTION AND THE FIX</text>
<text x="236.8" y="433.9">   [ ]  R1   The assumed position and the triangle</text>
<text x="236.8" y="450.2">   [ ]  R2   Hc and Zn</text>
<text x="236.8" y="466.6">   [ ]  R3   The intercept: toward or away</text>
<text x="236.8" y="483.0">   [ ]  R4   Plotting the line of position</text>
<text x="236.8" y="499.4">   [ ]  R5   Crossing, running, and knowing when to doubt it</text>
<text x="236.8" y="515.8">  ----------------------------------------------------------------------</text>
<text x="236.8" y="532.1">  4 of 20 lessons done.  Type a lesson code (F1, R3 ...) to open it.</text>
</g>
<g font-size="11.0" fill="#1f5673" text-anchor="end">
<text x="211.8" y="108.3">Lessons you have</text>
<text x="211.8" y="121.3">finished.</text>
</g>

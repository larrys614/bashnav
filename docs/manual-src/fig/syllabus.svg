<g font-size="11.0" fill="#1f5673">
<text x="825.7" y="52.7">Four modules, five lessons each:</text>
<text x="825.7" y="65.7">foundations, time and the almanac,</text>
<text x="825.7" y="78.7">the sextant, then reduction and the fix.</text>
</g>
<path d="M824.3,61.1 L344.6,70.3" stroke="#1f5673" stroke-width="1.15" fill="none" marker-end="url(#ah)" opacity="0.9"/>
<g font-size="11.0" fill="#a2542a">
<text x="825.7" y="370.4">Jump to any lesson by code, or</text>
<text x="825.7" y="383.4">press n for the next unfinished one.</text>
</g>
<path d="M824.3,372.4 L641.2,526.1" stroke="#a2542a" stroke-width="1.15" fill="none" marker-end="url(#ah2)" opacity="0.9"/>
<g font-size="11.0" fill="#a2542a" text-anchor="end">
<text x="211.8" y="265.6">Each lesson ends with a question.</text>
<text x="211.8" y="278.6">Answer it correctly and the lesson</text>
<text x="211.8" y="291.6">is ticked off.</text>
</g>
<path d="M213.3,274.1 L249.8,410.0" stroke="#a2542a" stroke-width="1.15" fill="none" marker-end="url(#ah2)" opacity="0.9"/>
